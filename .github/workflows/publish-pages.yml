name: Publish generated blog
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify the generated files
        run: "node -e \"const
          fs=require('fs'),p=require('path'),c=require('crypto'),m=JSON.parse(f\
          s.readFileSync('build.json'));for(const [url,hash] of
          Object.entries(m.files)){const u=new
          URL(url,'https://local.invalid').pathname;const
          file=u.split('/').map(decodeURIComponent).join('/').slice(1)+(u.endsW\
          ith('/')?'index.html':'');if(c.createHash('sha256').update(fs.readFil\
          eSync(file)).digest('hex')!==hash)throw Error('Changed generated file:
          '+file)}\""
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
